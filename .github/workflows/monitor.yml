name: AMC Odyssey 70mm Monitor

on:
  schedule:
    # Hourly, not more often: a full run checks ~60 candidate showtimes'
    # seat maps, and Cloudflare's challenge on that specific route takes
    # ~30-35s to resolve per showtime almost every time (measured, not a
    # code inefficiency -- see seat_scraper.py) -- runs take ~35-40 min.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: amc-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          patchright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Headed (via Xvfb), not headless -- see scrape_utils.py docstring.
        run: xvfb-run -a python main.py

      - name: Commit updated state
        run: |
          git config user.name "amc-ticket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update notified-showtimes state"
            git push
          fi
