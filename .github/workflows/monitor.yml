name: AMC Odyssey 70mm Monitor

on:
  schedule:
    # Hourly, not more often: a full run checks ~60 candidate showtimes'
    # seat maps, and Cloudflare's challenge on that specific route takes
    # ~30-35s to resolve per showtime almost every time (measured, not a
    # code inefficiency -- see seat_scraper.py) -- runs take ~35-40 min.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: amc-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          patchright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AMC_EMAIL: ${{ secrets.AMC_EMAIL }}
          AMC_PASSWORD: ${{ secrets.AMC_PASSWORD }}
          AMC_CVV: ${{ secrets.AMC_CVV }}
          AMC_AUTO_PURCHASE: ${{ vars.AMC_AUTO_PURCHASE }}
        # Headed (via Xvfb), not headless -- see scrape_utils.py docstring.
        run: xvfb-run -a python main.py

      - name: Commit updated state
        # Always runs, even if the step above failed partway through --
        # main.py saves state.json immediately after each purchase (see
        # main.py), and a mid-run crash must not lose that record: without
        # this, a purchased showtime could look unpurchased next run and
        # get bought again.
        if: always()
        # Runs take 35-40+ min, so a concurrent push to main (e.g. a manual
        # code push during that window) can win the race and make this
        # plain "git push" fail as a non-fast-forward. Retry with a rebase
        # a few times before giving up -- state.json is the only thing
        # this touches, so a real conflict here would be unusual.
        run: |
          git config user.name "amc-ticket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update notified-showtimes state"
            for i in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "push rejected, retrying with rebase (attempt $i)..."
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep $((i * 5))
            done
            exit 1
          fi
